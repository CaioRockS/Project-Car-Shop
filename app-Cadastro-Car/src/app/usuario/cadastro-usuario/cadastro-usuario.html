<main class="content">
  <div class="card">
    <h2>Novo usuário</h2>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="form">
      <div class="form-group">
        <label for="name">Nome:</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          name="name"
        >
      </div>

      <div class="form-group">
        <label for="type">Tipo:</label>
        <input
          id="type"
          type="text"
          formControlName="type"
          name="type"
        >
      </div>

      <div class="form-group">
        <label for="contactNumber">Contato:</label>
        <input
          id="contactNumber"
          type="tel"
          formControlName="contactNumber"
          name="contactNumber"
        >
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Salvar</button>
        <button
          type="button"
          class="btn-secondary"
          (click)="form.reset()"
        >
          Cancelar
        </button>
      </div>
    </form>
  </div>
</main>
